name: Build sdist and bdist on Tag Pushed

on:
  push:
    tags:
      - '*'

jobs:
  build_wheels:
    name: Build wheel ${{ matrix.python }}-${{ matrix.buildplat[1] }}
    runs-on: ${{ matrix.buildplat[0] }}
    strategy:
      fail-fast: false
      matrix:
        buildplat:
          - [ ubuntu-24.04, manylinux_x86_64 ]
          - [ ubuntu-24.04, musllinux_x86_64 ]
          - [ macos-26, macosx_arm64 ]
          - [ windows-2025, win_amd64 ]
        python: [ "cp313", "cp314" ]
    steps:
      - name: Checkout pyquadkey2
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build Wheel
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.buildplat[1] }}

      - name: Upload Wheel
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.python }}-${{ matrix.buildplat[1] }}
          path: ./wheelhouse/*.whl

      - name: Publish Wheel
        uses: softprops/action-gh-release@v3
        with:
          files: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pyquadkey2
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: build
        run: |
          python3 -m pip install build
          python3 -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: ./dist/*.tar.gz

      - name: Publish Wheel
        uses: softprops/action-gh-release@v3
        with:
          files: ./dist/*